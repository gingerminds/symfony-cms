services:
    _defaults:
        autowire: true
        autoconfigure: true

    test.rate_limiter_storage:
        class: Symfony\Component\RateLimiter\Storage\InMemoryStorage

    # Keeps PHPUnit output clean.
    logger:
        class: Psr\Log\NullLogger

    # Services fetched by the tests.
    test.file_reference_registry:
        alias: gingerminds_media_manager.file.reference_registry
        public: true

    test.page_workflow:
        alias: state_machine.gingerminds_cms_publication
        public: true

    # Project blocks (BlockRegistryTest): a block, an override of a bundle block, a block extension.
    Gingerminds\CmsBundle\Tests\Application\Block\:
        resource: '../Block/'

    test.block_registry:
        alias: gingerminds_cms.block.registry
        public: true
